<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="background: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentCyan)" />

  <!-- Header -->
  <g transform="translate(60, 48)">
    <text x="0" y="24" font-size="14" font-weight="900" letter-spacing="2" fill="#06b6d4" text-transform="uppercase">Patient-Led Science &amp; Consulting</text>
    <text x="0" y="68" font-size="38" font-weight="950" fill="#ffffff" letter-spacing="-1">Hiring Independent Biomedical Researchers</text>
    <text x="0" y="98" font-size="17" font-weight="500" fill="#94a3b8">Why hourly PhD scientists, literature analysts, and biostatisticians can beat standard clinical consults.</text>
  </g>

  <!-- 3 Pillars Grid -->

  <!-- Card 1: Where to Find Them -->
  <g transform="translate(60, 165)">
    <rect width="345" height="380" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="345" height="6" rx="3" fill="#06b6d4" />

    <text x="24" y="38" font-size="20" font-weight="900" fill="#ffffff">Where to Find Them</text>
    <text x="24" y="58" font-size="13" font-weight="600" fill="#22d3ee">Vetted Platforms &amp; Networks</text>

    <g transform="translate(24, 85)" font-size="13" font-weight="600" fill="#cbd5e1">
      <!-- Kolabtree -->
      <g transform="translate(0, 0)">
        <rect width="297" height="68" rx="8" fill="#162032" />
        <text x="14" y="22" font-size="14" font-weight="900" fill="#ffffff">Kolabtree ($50 to $150/hr)</text>
        <text x="14" y="42" font-size="12" font-weight="500" fill="#94a3b8">PhD scientists, biostatisticians,</text>
        <text x="14" y="58" font-size="12" font-weight="500" fill="#94a3b8">and neurobiology specialists.</text>
      </g>

      <!-- Upwork Specialized -->
      <g transform="translate(0, 78)">
        <rect width="297" height="68" rx="8" fill="#162032" />
        <text x="14" y="22" font-size="14" font-weight="900" fill="#ffffff">Upwork (Specialized Research)</text>
        <text x="14" y="42" font-size="12" font-weight="500" fill="#94a3b8">Biomedical literature reviewers</text>
        <text x="14" y="58" font-size="12" font-weight="500" fill="#94a3b8">with active PubMed publications.</text>
      </g>

      <!-- Academic Postdocs -->
      <g transform="translate(0, 156)">
        <rect width="297" height="68" rx="8" fill="#162032" />
        <text x="14" y="22" font-size="14" font-weight="900" fill="#ffffff">Academic Postdocs (Direct)</text>
        <text x="14" y="42" font-size="12" font-weight="500" fill="#94a3b8">Pain &amp; salivary biology fellows</text>
        <text x="14" y="58" font-size="12" font-weight="500" fill="#94a3b8">at McGill, Montreal, or US centers.</text>
      </g>

      <!-- Expert Networks -->
      <g transform="translate(0, 234)">
        <rect width="297" height="42" rx="8" fill="#162032" />
        <text x="14" y="26" font-size="13" font-weight="800" fill="#38bdf8">GLG / Guidepoint ($250+/hr)</text>
      </g>
    </g>
  </g>

  <!-- Card 2: 3 High-Leverage Tasks -->
  <g transform="translate(427, 165)">
    <rect width="345" height="380" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="345" height="6" rx="3" fill="#3b82f6" />

    <text x="24" y="38" font-size="20" font-weight="900" fill="#ffffff">How to Use Them</text>
    <text x="24" y="58" font-size="13" font-weight="600" fill="#60a5fa">High-Leverage Workflows</text>

    <g transform="translate(24, 85)" font-size="13.5" font-weight="600" fill="#cbd5e1">
      <!-- Task 1 -->
      <g transform="translate(0, 0)">
        <rect width="297" height="78" rx="8" fill="#1e3a5f" />
        <text x="14" y="24" font-size="14" font-weight="900" fill="#ffffff">1. Mechanism &amp; Citations</text>
        <text x="14" y="44" font-size="12" font-weight="500" fill="#93c5fd">Give your hypothesis chain</text>
        <text x="14" y="62" font-size="12" font-weight="500" fill="#93c5fd">(ASIC3, tubules, margin leaks).</text>
      </g>

      <!-- Task 2 -->
      <g transform="translate(0, 90)">
        <rect width="297" height="78" rx="8" fill="#1e3a5f" />
        <text x="14" y="24" font-size="14" font-weight="900" fill="#ffffff">2. Data Schema Audit</text>
        <text x="14" y="44" font-size="12" font-weight="500" fill="#93c5fd">Review patient tracking sheets</text>
        <text x="14" y="62" font-size="12" font-weight="500" fill="#93c5fd">to eliminate confounding factors.</text>
      </g>

      <!-- Task 3 -->
      <g transform="translate(0, 180)">
        <rect width="297" height="85" rx="8" fill="#1e3a5f" />
        <text x="14" y="24" font-size="14" font-weight="900" fill="#ffffff">3. Scientific Peer-Review</text>
        <text x="14" y="44" font-size="12" font-weight="500" fill="#93c5fd">Fact-check educational guides</text>
        <text x="14" y="62" font-size="12" font-weight="500" fill="#93c5fd">and establish medical rigor.</text>
      </g>
    </g>
  </g>

  <!-- Card 3: The Golden Boundary -->
  <g transform="translate(795, 165)">
    <rect width="345" height="380" rx="16" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
    <rect width="345" height="6" rx="3" fill="#a855f7" />

    <text x="24" y="38" font-size="20" font-weight="900" fill="#ffffff">The Legal Boundary</text>
    <text x="24" y="58" font-size="13" font-weight="600" fill="#c084fc">Protecting Scope &amp; Safety</text>

    <!-- Key Warning Box -->
    <g transform="translate(24, 85)">
      <rect width="297" height="120" rx="10" fill="#2e1065" stroke="#7c3aed" stroke-width="1" />
      <text x="16" y="26" font-size="12" font-weight="900" fill="#f43f5e" letter-spacing="1">STRICT CONSULTING BOUNDARY</text>
      <text x="16" y="50" font-size="13" font-weight="700" fill="#f3e8ff">No Individual Medical Diagnosis</text>
      <text x="16" y="72" font-size="12" font-weight="500" fill="#d8b4fe">Keep assignments strictly framed</text>
      <text x="16" y="90" font-size="12" font-weight="500" fill="#d8b4fe">as literature review, data audits,</text>
      <text x="16" y="108" font-size="12" font-weight="500" fill="#d8b4fe">and educational fact-checking.</text>
    </g>

    <!-- Benefits Box -->
    <g transform="translate(24, 220)">
      <rect width="297" height="135" rx="10" fill="#162032" />
      <text x="16" y="26" font-size="13" font-weight="900" fill="#38bdf8">The Strategic Advantage</text>
      <g font-size="12" font-weight="500" fill="#cbd5e1">
        <text x="16" y="52"><tspan fill="#22d3ee">✓</tspan> 100% focused on mechanism</text>
        <text x="16" y="74"><tspan fill="#22d3ee">✓</tspan> Zero 15-minute appointment rush</text>
        <text x="16" y="96"><tspan fill="#22d3ee">✓</tspan> Direct access to full paper PDFs</text>
        <text x="16" y="118"><tspan fill="#22d3ee">✓</tspan> Clean data for your clinician</text>
      </g>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(60, 582)">
    <text x="0" y="18" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="0.5">DecodingTheBurn.com</text>
    <text x="1080" y="18" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="end">Empowering Patient-Led Research</text>
  </g>
</svg>
