<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#070b14"/>
  <!-- Top Red Arrow pointing UP over both F's -->
  <polygon points="32,6 54,14 10,14" fill="#ef4444"/>
  <!-- Dual FF letters in Plus Jakarta Sans / heavy sans -->
  <text x="14" y="47" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#34d399" letter-spacing="-1">F</text>
  <text x="33" y="47" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ef4444" letter-spacing="-1">F</text>
  <!-- Bottom Green Arrow pointing DOWN under both F's -->
