<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="background: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Red Alert Gradient for BMS -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>

    <!-- Muted Slate Gradient for Perio -->
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentPurple)" />

  <!-- Header -->
  <g transform="translate(60, 48)">
    <text x="0" y="24" font-size="14" font-weight="900" letter-spacing="2" fill="#f43f5e" text-transform="uppercase">Biological Alarm Paradox</text>
    <text x="0" y="68" font-size="38" font-weight="950" fill="#ffffff" letter-spacing="-1">The Oral Alarm Paradox</text>
    <text x="0" y="98" font-size="17" font-weight="500" fill="#94a3b8">Why the disease that destroys bone has no alarm, while the condition without tissue damage screams.</text>
  </g>

  <!-- Side-by-Side Comparison Cards -->

  <!-- Card 1: Periodontal Disease (Silent Destruction) -->
  <g transform="translate(60, 175)">
    <rect width="520" height="360" rx="18" fill="url(#slateGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="520" height="6" rx="3" fill="#64748b" />

    <!-- Badge / Label -->
    <text x="32" y="42" font-size="13" font-weight="900" fill="#94a3b8" letter-spacing="1.5">PERIODONTAL DISEASE</text>
    <text x="32" y="78" font-size="28" font-weight="950" fill="#ffffff">Severe Damage, Zero Alarm</text>

    <!-- Key Status Box -->
    <g transform="translate(32, 98)">
      <rect width="456" height="58" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <text x="20" y="26" font-size="13" font-weight="800" fill="#94a3b8">BIOLOGICAL STATUS</text>
      <text x="20" y="46" font-size="16" font-weight="900" fill="#38bdf8">Massive Bone Loss • 0/10 Pain</text>
    </g>

    <!-- Bullet Points -->
    <g transform="translate(32, 185)" font-size="14.5" font-weight="600" fill="#cbd5e1">
      <text x="0" y="0"><tspan fill="#64748b" font-weight="900">• </tspan>Bacterial plaque releases subtle toxins below gums</text>
      <text x="0" y="32"><tspan fill="#64748b" font-weight="900">• </tspan>Destroys alveolar bone and periodontal ligament silently</text>
      <text x="0" y="64"><tspan fill="#64748b" font-weight="900">• </tspan>Patients feel completely fine while teeth lose support</text>
      <text x="0" y="96"><tspan fill="#64748b" font-weight="900">• </tspan>The body never triggers an acute nociceptive alarm</text>
      <text x="0" y="128"><tspan fill="#64748b" font-weight="900">• </tspan>Discovered only during routine dental probing</text>
    </g>
  </g>

  <!-- Card 2: Burning Mouth Syndrome (Screaming Alarm) -->
  <g transform="translate(620, 175)">
    <rect width="520" height="360" rx="18" fill="url(#redGrad)" stroke="#f43f5e" stroke-width="2" />
    <rect width="520" height="6" rx="3" fill="#f43f5e" />

    <!-- Badge / Label -->
    <text x="32" y="42" font-size="13" font-weight="900" fill="#fca5a5" letter-spacing="1.5">BURNING MOUTH SYNDROME</text>
    <text x="32" y="78" font-size="28" font-weight="950" fill="#ffffff">Zero Damage, Screaming Alarm</text>

    <!-- Key Status Box -->
    <g transform="translate(32, 98)">
      <rect width="456" height="58" rx="10" fill="#2a0612" stroke="#881337" stroke-width="1" />
      <text x="20" y="26" font-size="13" font-weight="800" fill="#fca5a5">BIOLOGICAL STATUS</text>
      <text x="20" y="46" font-size="16" font-weight="900" fill="#f43f5e">Zero Visible Lesions • 10/10 Agony</text>
    </g>

    <!-- Bullet Points -->
    <g transform="translate(32, 185)" font-size="14.5" font-weight="600" fill="#ffe4e6">
      <text x="0" y="0"><tspan fill="#f43f5e" font-weight="900">• </tspan>Nerves fire continuously without tissue necrosis</text>
      <text x="0" y="32"><tspan fill="#f43f5e" font-weight="900">• </tspan>Feels like severe scalded skin or boiling hot pepper</text>
      <text x="0" y="64"><tspan fill="#f43f5e" font-weight="900">• </tspan>Triggered by proton channels (ASIC3/TRPV1) &amp; tubules</text>
      <text x="0" y="96"><tspan fill="#f43f5e" font-weight="900">• </tspan>The alarm system is stuck at maximum volume</text>
      <text x="0" y="128"><tspan fill="#f43f5e" font-weight="900">• </tspan>Dismissed because standard mirrors see healthy tissue</text>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(60, 582)">
    <text x="0" y="18" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="0.5">DecodingTheBurn.com</text>
    <text x="1080" y="18" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="end">Sensory Neurobiology vs. Periodontal Pathology</text>
  </g>
</svg>
