<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1025" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)" />
  <rect width="1280" height="720" fill="url(#glow)" />
  <rect width="1280" height="720" fill="url(#grid)" />

  <!-- Outer Border -->
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="rgba(225, 29, 72, 0.25)" stroke-width="2" />

  <!-- Central Badge Container -->
  <g transform="translate(640, 340)">
    <!-- Pill Box -->
    <rect x="-240" y="-55" width="480" height="110" rx="20" fill="#be123c" stroke="rgba(254, 205, 211, 0.4)" stroke-width="3" filter="drop-shadow(0px 10px 30px rgba(225, 29, 72, 0.5))" />
    
    <!-- Text: Coming Soon -->
    <text x="0" y="16" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">COMING SOON</text>
  </g>

  <!-- Brand Subtitle -->
  <text x="640" y="475" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="4">DECODING THE BURN · PRESENTATION DECK</text>
</svg>
