<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="background: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Top Brand Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentPurple)" />

  <!-- Header Section -->
  <g transform="translate(60, 50)">
    <text x="0" y="24" font-size="14" font-weight="900" letter-spacing="2" fill="#a855f7" text-transform="uppercase">Clinical Specialty Investigation</text>
    <text x="0" y="68" font-size="38" font-weight="950" fill="#ffffff" letter-spacing="-1">Who Actually Treats Burning Mouth Syndrome?</text>
    <text x="0" y="98" font-size="17" font-weight="500" fill="#94a3b8">The Global Care Shortage: Orofacial Pain (OFP) vs. Oral Medicine (OM)</text>
  </g>

  <!-- Main Comparison Columns (Side-by-Side Cards) -->

  <!-- Column 1: Oral Medicine -->
  <g transform="translate(60, 180)">
    <!-- Card Frame -->
    <rect width="335" height="340" rx="16" fill="url(#cardBlue)" stroke="#334155" stroke-width="1.5" />
    <rect width="335" height="6" rx="3" fill="#3b82f6" />
    
    <!-- Title -->
    <text x="24" y="38" font-size="22" font-weight="900" fill="#ffffff">Oral Medicine</text>
    <text x="24" y="58" font-size="13" font-weight="600" fill="#38bdf8">Mucosal &amp; Systemic Biology</text>

    <!-- Stat Highlight -->
    <g transform="translate(24, 76)">
      <rect width="287" height="62" rx="10" fill="#1e3a5f" />
      <text x="16" y="28" font-size="24" font-weight="950" fill="#60a5fa">~175 In Entire US</text>
      <text x="16" y="48" font-size="12" font-weight="700" fill="#93c5fd">Board-Certified Diplomates (ABOM)</text>
    </g>

    <!-- Clinical Focus Bullets -->
    <g transform="translate(24, 162)" font-size="13.5" font-weight="600" fill="#e2e8f0">
      <text x="0" y="0"><tspan fill="#38bdf8" font-weight="900">• </tspan>Fungal &amp; Bacterial Exclusion</text>
      <text x="0" y="28"><tspan fill="#38bdf8" font-weight="900">• </tspan>Salivary Gland Testing (Xerostomia)</text>
      <text x="0" y="56"><tspan fill="#38bdf8" font-weight="900">• </tspan>Blood &amp; Autoimmune Screenings</text>
      <text x="0" y="84"><tspan fill="#38bdf8" font-weight="900">• </tspan>Topical Clonazepam Rinses</text>
      <text x="0" y="112"><tspan fill="#38bdf8" font-weight="900">• </tspan>Systemic Neuropathic Rx (Gabapentin)</text>
    </g>
  </g>

  <!-- Center Bridge: The Burning Mouth Patient -->
  <g transform="translate(425, 230)">
    <rect width="350" height="240" rx="18" fill="#1e1138" stroke="#a855f7" stroke-width="2" />
    
    <text x="175" y="38" font-size="18" font-weight="900" fill="#f3e8ff" text-anchor="middle">Burning Mouth Syndrome</text>
    <text x="175" y="58" font-size="12.5" font-weight="600" fill="#d8b4fe" text-anchor="middle">Trapped Between Two Disciplines</text>

    <!-- Microscopic Gap Warning Box -->
    <g transform="translate(20, 78)">
      <rect width="310" height="135" rx="12" fill="#090514" stroke="#7c3aed" stroke-width="1" />
      <text x="155" y="26" font-size="12" font-weight="900" fill="#f43f5e" text-anchor="middle" letter-spacing="1">THE CRITICAL OVERLOOKED GAP</text>
      
      <g font-size="12" font-weight="600" fill="#cbd5e1">
        <text x="16" y="52"><tspan fill="#a855f7">✓</tspan> Microscopic Crown Margin Leaks</text>
        <text x="16" y="74"><tspan fill="#a855f7">✓</tspan> Exposed Root Tubules &amp; Acid Ions</text>
        <text x="16" y="96"><tspan fill="#a855f7">✓</tspan> ASIC3 &amp; TRPV1 Proton Receptors</text>
        <text x="16" y="118"><tspan fill="#a855f7">✓</tspan> Heavy Canine Bite Friction</text>
      </g>
    </g>
  </g>

  <!-- Column 2: Orofacial Pain -->
  <g transform="translate(805, 180)">
    <!-- Card Frame -->
    <rect width="335" height="340" rx="16" fill="url(#cardBlue)" stroke="#334155" stroke-width="1.5" />
    <rect width="335" height="6" rx="3" fill="#a855f7" />
    
    <!-- Title -->
    <text x="24" y="38" font-size="22" font-weight="900" fill="#ffffff">Orofacial Pain</text>
    <text x="24" y="58" font-size="13" font-weight="600" fill="#c084fc">Nerves &amp; Biomechanical Load</text>

    <!-- Stat Highlight -->
    <g transform="translate(24, 76)">
      <rect width="287" height="62" rx="10" fill="#3b1560" />
      <text x="16" y="28" font-size="24" font-weight="950" fill="#d8b4fe">~220 In Entire US</text>
      <text x="16" y="48" font-size="12" font-weight="700" fill="#e9d5ff">Board-Certified Diplomates (ABOP)</text>
    </g>

    <!-- Clinical Focus Bullets -->
    <g transform="translate(24, 162)" font-size="13.5" font-weight="600" fill="#e2e8f0">
      <text x="0" y="0"><tspan fill="#c084fc" font-weight="900">• </tspan>Trigeminal Nerve Pathway Mapping</text>
      <text x="0" y="28"><tspan fill="#c084fc" font-weight="900">• </tspan>Central Pain Sensitization</text>
      <text x="0" y="56"><tspan fill="#c084fc" font-weight="900">• </tspan>Canine Guidance &amp; Bite Force</text>
      <text x="0" y="84"><tspan fill="#c084fc" font-weight="900">• </tspan>Temporomandibular Joint (TMJ)</text>
      <text x="0" y="112"><tspan fill="#c084fc" font-weight="900">• </tspan>Sleep Apnea &amp; Nocturnal Clenching</text>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(60, 575)">
    <text x="0" y="20" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="0.5">DecodingTheBurn.com</text>
    <text x="1080" y="20" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="end">Source: ADA, CODA, ABOP, AAOM Clinical Registry Data</text>
  </g>
</svg>
