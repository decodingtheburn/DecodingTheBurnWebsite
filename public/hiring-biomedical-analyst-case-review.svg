<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="45%" stop-color="#090f1d"/>
      <stop offset="100%" stop-color="#14081f"/>
    </linearGradient>
    <linearGradient id="kolabtreeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
  </g>

  <!-- Kicker Label -->
  <text x="80" y="78" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#38bdf8" letter-spacing="3" text-transform="uppercase">
    CLINICAL AUDIT PROTOCOL • FREELANCE SCIENTIST HIRING
  </text>

  <!-- Main Headline -->
  <text x="80" y="132" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Hiring PhD Researchers for Case Review
  </text>

  <!-- Subheadline -->
  <text x="80" y="172" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
    When paying an independent biomedical analyst sheds light vs when it wastes money
  </text>

  <!-- COMPARISON CONTAINER (2 COLUMNS) -->

  <!-- Left Column: THE TRAP (Generic Review) -->
  <g transform="translate(80, 210)">
    <rect width="490" height="340" rx="20" fill="#0c111d" stroke="#ef4444" stroke-width="1.8" opacity="0.95"/>
    <rect width="490" height="48" rx="20" fill="rgba(239, 68, 68, 0.12)"/>
    
    <!-- Header -->
    <text x="24" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800" fill="#fca5a5" letter-spacing="0.5">
      THE TRAP: OPEN-ENDED CLINICAL GUESSING
    </text>

    <!-- Subtext -->
    <text x="24" y="75" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ef4444">
      What happens if you ask: "Review my story and tell me what is wrong"
    </text>

    <!-- Point 1 -->
    <g transform="translate(24, 100)">
      <circle cx="10" cy="10" r="10" fill="rgba(239, 68, 68, 0.2)"/>
      <text x="7" y="14" font-family="sans-serif" font-size="12" font-weight="900" fill="#ef4444">X</text>
      <text x="30" y="14" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">They default to standard medical textbook dogma</text>
      <text x="30" y="32" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">"BMS is idiopathic, idiopathic means unknown cause, try clonazepam."</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(24, 160)">
      <circle cx="10" cy="10" r="10" fill="rgba(239, 68, 68, 0.2)"/>
      <text x="7" y="14" font-family="sans-serif" font-size="12" font-weight="900" fill="#ef4444">X</text>
      <text x="30" y="14" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">They regurgitate Wikipedia / secondary review papers</text>
      <text x="30" y="32" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">You pay $100 to read what you already found on Google Scholar.</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(24, 220)">
      <circle cx="10" cy="10" r="10" fill="rgba(239, 68, 68, 0.2)"/>
      <text x="7" y="14" font-family="sans-serif" font-size="12" font-weight="900" fill="#ef4444">X</text>
      <text x="30" y="14" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Regulatory defensive hedging</text>
      <text x="30" y="32" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">They fear licensing liability and tell you to "consult your local doctor."</text>
    </g>

    <!-- Result Pill -->
    <rect x="24" y="280" width="442" height="38" rx="8" fill="rgba(239, 68, 68, 0.15)"/>
    <text x="40" y="304" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#fca5a5">
      Result: Zero new insight • $100 to $300 wasted on generic summary
    </text>
  </g>

  <!-- Right Column: THE HIGH LEVERAGE AUDIT -->
  <g transform="translate(630, 210)">
    <rect width="490" height="340" rx="20" fill="#0c111d" stroke="#10b981" stroke-width="1.8" opacity="0.95"/>
    <rect width="490" height="48" rx="20" fill="rgba(16, 185, 129, 0.12)"/>
    
    <!-- Header -->
    <text x="24" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800" fill="#a7f3d0" letter-spacing="0.5">
      THE PLAYBOOK: FORENSIC MECHANISM AUDIT
    </text>

    <!-- Subtext -->
    <text x="24" y="75" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#34d399">
      What to ask instead: "Audit this specific biophysical chain"
    </text>

    <!-- Point 1 -->
    <g transform="translate(24, 100)">
      <circle cx="10" cy="10" r="10" fill="rgba(16, 185, 129, 0.2)"/>
      <path d="M 6,10 L 9,14 L 14,7" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="14" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Audit the receptor gate mechanics (ASIC3 / TRPV1)</text>
      <text x="30" y="32" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">"Pull PubMed papers on how resting salivary pH 6.3 opens open-state ASIC3."</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(24, 160)">
      <circle cx="10" cy="10" r="10" fill="rgba(16, 185, 129, 0.2)"/>
      <path d="M 6,10 L 9,14 L 14,7" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="14" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Check dental hardware micro-leak literature</text>
      <text x="30" y="32" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">"Review in-vitro studies on marginal breakdown of resin-bonded ceramics."</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(24, 220)">
      <circle cx="10" cy="10" r="10" fill="rgba(16, 185, 129, 0.2)"/>
      <path d="M 6,10 L 9,14 L 14,7" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="14" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Clean up tracking schema &amp; confounding variables</text>
      <text x="30" y="32" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Ensure your circadian 14-day logs meet clinical journal publishing standards.</text>
    </g>

    <!-- Result Pill -->
    <rect x="24" y="280" width="442" height="38" rx="8" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="40" y="304" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">
      Result: Rigorous scientific citations • Ironclad methodology • True leverage
    </text>
  </g>

  <!-- Bottom Platform Bar -->
  <g transform="translate(80, 576)">
    <rect width="1040" height="32" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#64748b">
      Platforms: <tspan fill="#38bdf8">Kolabtree</tspan> (PhD Specialists) • <tspan fill="#38bdf8">Upwork</tspan> (Biomedical Analysts) • Rates: <tspan fill="#ffffff">$20 to $60/hr</tspan> • Target: Oral Biology, Neurobiology, Salivary Physiology
    </text>
  </g>
</svg>
