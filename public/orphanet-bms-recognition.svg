<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="glow-circle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Ambient Glow Behind Code -->
  <circle cx="950" cy="315" r="280" fill="url(#glow-circle)"/>

  <!-- Left Content Box -->
  <g transform="translate(80, 110)">
    <!-- Metadata Label -->
    <rect x="0" y="0" width="280" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="14" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#38bdf8" letter-spacing="1.5">ORPHANET RARE DISEASES</text>

    <!-- Main Headline -->
    <text x="0" y="95" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Burning Mouth Syndrome
    </text>
    <text x="0" y="150" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="900" fill="#38bdf8" letter-spacing="-1">
      Official Orphanet Registry
    </text>

    <!-- Subtitle -->
    <text x="0" y="210" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      European Rare Disease Portal validation (ORPHA:353253)
    </text>
    <text x="0" y="240" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      and patient association indexing for clinical research.
    </text>

    <!-- Key Metrics Badges -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="165" height="54" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="18" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#64748b">DISEASE CODE</text>
      <text x="18" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#38bdf8">ORPHA:353253</text>

      <rect x="180" y="0" width="165" height="54" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="198" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#64748b">ICD-11 CODE</text>
      <text x="198" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#10b981">DA0F.0</text>

      <rect x="360" y="0" width="165" height="54" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="378" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#64748b">ICD-10 CODE</text>
      <text x="378" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#f59e0b">K14.6</text>
    </g>
  </g>

  <!-- Right Visual Certificate Card -->
  <g transform="translate(740, 100)">
    <rect width="380" height="430" rx="20" fill="#0c1222" stroke="url(#card-border)" stroke-width="2" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))"/>
    
    <!-- Header banner in card -->
    <rect x="25" y="30" width="330" height="48" rx="8" fill="#1e293b"/>
    <text x="45" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#38bdf8" letter-spacing="1">ORPHANET DATA SHEET</text>

    <!-- Details List -->
    <g transform="translate(30, 115)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#64748b">DIAGNOSTIC CRITERIA</text>
      <text x="0" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Bilateral symmetrical oral burning</text>
      <text x="0" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Absence of visible mucosal lesions</text>

      <line x1="0" y1="70" x2="320" y2="70" stroke="#1e293b" stroke-width="1.5"/>

      <text x="0" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#64748b">ADVOCACY MILESTONE</text>
      <text x="0" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#10b981">Official Patient Org Registration</text>
      <text x="0" y="144" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Association reconnue des maladies rares</text>

      <line x1="0" y1="170" x2="320" y2="170" stroke="#1e293b" stroke-width="1.5"/>

      <text x="0" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#64748b">PORTAL URL</text>
      <text x="0" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#38bdf8">orpha.net/consor/cgi-bin</text>
      <text x="0" y="244" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#64748b">Code ORPHA:353253</text>
    </g>
  </g>
</svg>
