<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="background: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentPurple)" />

  <!-- Header -->
  <g transform="translate(60, 48)">
    <text x="0" y="24" font-size="14" font-weight="900" letter-spacing="2" fill="#c084fc" text-transform="uppercase">Clinical Directory &amp; Literature Leaders</text>
    <text x="0" y="68" font-size="38" font-weight="950" fill="#ffffff" letter-spacing="-1">Orofacial Pain Leaders</text>
    <text x="0" y="98" font-size="17" font-weight="500" fill="#94a3b8">The key clinician-scientists who published landmark papers on trigeminal neuropathic pain and BMS.</text>
  </g>

  <!-- 3 Category Cards -->

  <!-- Card 1: Foundational AAOP Architects -->
  <g transform="translate(60, 165)">
    <rect width="345" height="380" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="345" height="6" rx="3" fill="#3b82f6" />

    <text x="24" y="38" font-size="19" font-weight="900" fill="#ffffff">Foundational Leaders</text>
    <text x="24" y="58" font-size="13" font-weight="600" fill="#60a5fa">Biomechanics, Occlusion, TMD</text>

    <g transform="translate(24, 85)" font-size="13" font-weight="600" fill="#cbd5e1">
      <g transform="translate(0, 0)">
        <rect width="297" height="74" rx="8" fill="#162032" />
        <text x="14" y="22" font-size="14" font-weight="900" fill="#ffffff">Dr. Jeffrey P. Okeson</text>
        <text x="14" y="42" font-size="12" font-weight="500" fill="#94a3b8">University of Kentucky</text>
        <text x="14" y="60" font-size="12" font-weight="700" fill="#38bdf8">Landmark: Occlusion &amp; TMD Textbook</text>
      </g>

      <g transform="translate(0, 84)">
        <rect width="297" height="74" rx="8" fill="#162032" />
        <text x="14" y="22" font-size="14" font-weight="900" fill="#ffffff">Dr. Harold Gelb</text>
        <text x="14" y="42" font-size="12" font-weight="500" fill="#94a3b8">Founder / 1st AAOP President</text>
        <text x="14" y="60" font-size="12" font-weight="700" fill="#38bdf8">Landmark: Mandibular Posture &amp; Pain</text>
      </g>

      <g transform="translate(0, 168)">
        <rect width="297" height="74" rx="8" fill="#162032" />
        <text x="14" y="22" font-size="14" font-weight="900" fill="#ffffff">Dr. Gary Slade &amp; OPPERA</text>
        <text x="14" y="42" font-size="12" font-weight="500" fill="#94a3b8">UNC Chapel Hill / NIH</text>
        <text x="14" y="60" font-size="12" font-weight="700" fill="#38bdf8">Landmark: Genetic &amp; Sensory Risk</text>
      </g>
    </g>
  </g>

  <!-- Card 2: Trigeminal & BMS Neuropathy -->
  <g transform="translate(427, 165)">
    <rect width="345" height="380" rx="16" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
    <rect width="345" height="6" rx="3" fill="#a855f7" />

    <text x="24" y="38" font-size="19" font-weight="900" fill="#ffffff">BMS Small-Fiber Leaders</text>
    <text x="24" y="58" font-size="13" font-weight="600" fill="#c084fc">Proving True Nerve Pathology</text>

    <g transform="translate(24, 85)" font-size="13" font-weight="600" fill="#cbd5e1">
      <g transform="translate(0, 0)">
        <rect width="297" height="74" rx="8" fill="#24123b" />
        <text x="14" y="22" font-size="14" font-weight="900" fill="#ffffff">Dr. Giuseppe Lauria</text>
        <text x="14" y="42" font-size="12" font-weight="500" fill="#d8b4fe">Besta Neurological Institute, Milan</text>
        <text x="14" y="60" font-size="12" font-weight="700" fill="#f43f5e">2005 Biopsy: Small-Fiber Neuropathy</text>
      </g>

      <g transform="translate(0, 84)">
        <rect width="297" height="74" rx="8" fill="#24123b" />
        <text x="14" y="22" font-size="14" font-weight="900" fill="#ffffff">Dr. Rafael Benoliel</text>
        <text x="14" y="42" font-size="12" font-weight="500" fill="#d8b4fe">Rutgers University</text>
        <text x="14" y="60" font-size="12" font-weight="700" fill="#c084fc">Landmark: Trigeminal Nerve Injury</text>
      </g>

      <g transform="translate(0, 168)">
        <rect width="297" height="74" rx="8" fill="#24123b" />
        <text x="14" y="22" font-size="14" font-weight="900" fill="#ffffff">Dr. Päivi Jääskeläinen</text>
        <text x="14" y="42" font-size="12" font-weight="500" fill="#d8b4fe">University of Turku, Finland</text>
        <text x="14" y="60" font-size="12" font-weight="700" fill="#c084fc">Landmark: Dopaminergic Pain Relay</text>
      </g>
    </g>
  </g>

  <!-- Card 3: Clinical Protocols & Receptors -->
  <g transform="translate(795, 165)">
    <rect width="345" height="380" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="345" height="6" rx="3" fill="#06b6d4" />

    <text x="24" y="38" font-size="19" font-weight="900" fill="#ffffff">Protocols &amp; Receptors</text>
    <text x="24" y="58" font-size="13" font-weight="600" fill="#22d3ee">Classifications &amp; Receptors</text>

    <g transform="translate(24, 85)" font-size="13" font-weight="600" fill="#cbd5e1">
      <g transform="translate(0, 0)">
        <rect width="297" height="74" rx="8" fill="#162032" />
        <text x="14" y="22" font-size="14" font-weight="900" fill="#ffffff">Dr. Elisa Borsani</text>
        <text x="14" y="42" font-size="12" font-weight="500" fill="#94a3b8">University of Brescia</text>
        <text x="14" y="60" font-size="12" font-weight="700" fill="#38bdf8">2014 Study: TRPV1 Receptor Density</text>
      </g>

      <g transform="translate(0, 84)">
        <rect width="297" height="74" rx="8" fill="#162032" />
        <text x="14" y="22" font-size="14" font-weight="900" fill="#ffffff">Dr. Antonio Scala</text>
        <text x="14" y="42" font-size="12" font-weight="500" fill="#94a3b8">University of Bologna</text>
        <text x="14" y="60" font-size="12" font-weight="700" fill="#38bdf8">Landmark: Primary vs Secondary BMS</text>
      </g>

      <g transform="translate(0, 168)">
        <rect width="297" height="74" rx="8" fill="#162032" />
        <text x="14" y="22" font-size="14" font-weight="900" fill="#ffffff">Dr. Joanna Zakrzewska</text>
        <text x="14" y="42" font-size="12" font-weight="500" fill="#94a3b8">University College London</text>
        <text x="14" y="60" font-size="12" font-weight="700" fill="#38bdf8">Landmark: Evidence-Based Trials</text>
      </g>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(60, 582)">
    <text x="0" y="18" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="0.5">DecodingTheBurn.com</text>
    <text x="1080" y="18" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="end">Source: PubMed, AAOP, IASP Landmark Literature</text>
  </g>
</svg>
