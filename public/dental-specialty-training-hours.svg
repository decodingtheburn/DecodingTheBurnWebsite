<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradSchool" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="gradResidency" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="50" y="55" font-size="26" font-weight="900" fill="#0f172a">Dental Specialist Clinical Training Hours</text>
  <text x="50" y="85" font-size="15" font-weight="500" fill="#475569">Comparison of 4-Year Dental School Baseline vs. Post-Doctoral Residency Hours</text>

  <!-- Legend -->
  <g transform="translate(560, 45)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="url(#gradSchool)" />
    <text x="26" y="14" font-size="13" font-weight="700" fill="#1e293b">Dental School (4,800 Hrs)</text>
    
    <rect x="210" y="0" width="18" height="18" rx="4" fill="url(#gradResidency)" />
    <text x="236" y="14" font-size="13" font-weight="700" fill="#1e293b">Specialty Residency</text>
  </g>

  <!-- Grid Axis (Scale: 0 to 22,000 hrs. Chart area: x=280 to x=920, width=640px. 1 hr = 640 / 22000 = 0.02909 px) -->
  <!-- 0 hrs = x:280, 5,000 = x:425, 10,000 = x:571, 15,000 = x:716, 20,000 = x:862 -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4">
    <line x1="280" y1="120" x2="280" y2="520" />
    <line x1="425" y1="120" x2="425" y2="520" />
    <line x1="571" y1="120" x2="571" y2="520" />
    <line x1="716" y1="120" x2="716" y2="520" />
    <line x1="862" y1="120" x2="862" y2="520" />
  </g>

  <!-- Axis Labels -->
  <g font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">
    <text x="280" y="540">0</text>
    <text x="425" y="540">5,000</text>
    <text x="571" y="540">10,000</text>
    <text x="716" y="540">15,000</text>
    <text x="862" y="540">20,000 hrs</text>
  </g>

  <!-- Row 1: General Dentist (DDS/DMD) -> 4,800 + 0 = 4,800 hrs -->
  <!-- School bar: width = 4800 * 0.02909 = 139.6 px -->
  <g transform="translate(0, 130)">
    <text x="260" y="32" font-size="15" font-weight="800" fill="#0f172a" text-anchor="end">General Dentist (DDS/DMD)</text>
    <rect x="280" y="10" width="139.6" height="34" rx="4" fill="url(#gradSchool)" />
    <text x="430" y="32" font-size="13" font-weight="800" fill="#0f172a">4,800 hrs (Entry Baseline)</text>
  </g>

  <!-- Row 2: Orofacial Pain Specialist -> 4,800 + 4,000 (2 yrs) = 8,800 hrs -->
  <!-- Res bar: width = 4000 * 0.02909 = 116.4 px -->
  <g transform="translate(0, 195)">
    <text x="260" y="32" font-size="15" font-weight="800" fill="#0f172a" text-anchor="end">Orofacial Pain Specialist</text>
    <rect x="280" y="10" width="139.6" height="34" rx="4" fill="url(#gradSchool)" />
    <rect x="419.6" y="10" width="116.4" height="34" rx="4" fill="url(#gradResidency)" />
    <text x="548" y="32" font-size="13" font-weight="800" fill="#0f172a">8,800 hrs (+4,000 res)</text>
  </g>

  <!-- Row 3: Orthodontist -> 4,800 + 6,000 (3 yrs) = 10,800 hrs -->
  <!-- Res bar: width = 6000 * 0.02909 = 174.5 px -->
  <g transform="translate(0, 260)">
    <text x="260" y="32" font-size="15" font-weight="800" fill="#0f172a" text-anchor="end">Orthodontist</text>
    <rect x="280" y="10" width="139.6" height="34" rx="4" fill="url(#gradSchool)" />
    <rect x="419.6" y="10" width="174.5" height="34" rx="4" fill="url(#gradResidency)" />
    <text x="606" y="32" font-size="13" font-weight="800" fill="#0f172a">10,800 hrs (+6,000 res)</text>
  </g>

  <!-- Row 4: Periodontist -> 4,800 + 7,500 (3 yrs surgical) = 12,300 hrs -->
  <!-- Res bar: width = 7500 * 0.02909 = 218.2 px -->
  <g transform="translate(0, 325)">
    <text x="260" y="32" font-size="15" font-weight="800" fill="#0f172a" text-anchor="end">Periodontist</text>
    <rect x="280" y="10" width="139.6" height="34" rx="4" fill="url(#gradSchool)" />
    <rect x="419.6" y="10" width="218.2" height="34" rx="4" fill="url(#gradResidency)" />
    <text x="650" y="32" font-size="13" font-weight="800" fill="#0f172a">12,300 hrs (+7,500 res)</text>
  </g>

  <!-- Row 5: Prosthodontist -> 4,800 + 8,500 (3 yrs clinical & lab) = 13,300 hrs -->
  <!-- Res bar: width = 8500 * 0.02909 = 247.3 px -->
  <g transform="translate(0, 390)">
    <text x="260" y="32" font-size="15" font-weight="800" fill="#0f172a" text-anchor="end">Prosthodontist</text>
    <rect x="280" y="10" width="139.6" height="34" rx="4" fill="url(#gradSchool)" />
    <rect x="419.6" y="10" width="247.3" height="34" rx="4" fill="url(#gradResidency)" />
    <text x="679" y="32" font-size="13" font-weight="800" fill="#0f172a">13,300 hrs (+8,500 res)</text>
  </g>

  <!-- Row 6: Oral & Maxillofacial Surgeon -> 4,800 + 16,000 (4-6 yrs hospital) = 20,800 hrs -->
  <!-- Res bar: width = 16000 * 0.02909 = 465.4 px -->
  <g transform="translate(0, 455)">
    <text x="260" y="32" font-size="15" font-weight="800" fill="#0f172a" text-anchor="end">Oral Maxillofacial Surgeon</text>
    <rect x="280" y="10" width="139.6" height="34" rx="4" fill="url(#gradSchool)" />
    <rect x="419.6" y="10" width="465.4" height="34" rx="4" fill="url(#gradResidency)" />
    <text x="896" y="32" font-size="13" font-weight="800" fill="#0f172a">20,800 hrs (+16,000 res)</text>
  </g>

  <!-- Bottom Annotation -->
  <text x="50" y="580" font-size="12" font-weight="500" fill="#64748b">*Estimates based on CODA post-doctoral standards: 4-yr dental school (~4,800 hrs) plus full-time accredited residency training programs.</text>
</svg>
